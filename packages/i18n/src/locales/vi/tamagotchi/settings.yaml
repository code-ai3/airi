        load-error: Không thể tải cài đặt biểu tượng ứng dụng.
        save-error: Không thể cập nhật cài đặt biểu tượng ứng dụng.
devtools:
  title: Nhà phát triển
  pages:
    context-flow:
      title: Luồng ngữ cảnh
    editor:
      title: Trình chỉnh sửa AIRI
      description: Mở cửa sổ Trình chỉnh sửa AIRI độc lập
      button: Mở trình chỉnh sửa
    lag-visualizer:
      title: Trình trực quan hóa độ trễ
    performance-visualizer:
      title: Trình trực quan hóa hiệu năng
      description: Bật/Tắt lớp phủ hiển thị FPS/tác vụ dài/bộ nhớ
      controls:
        enable-all:
          label: Bật tất cả các chỉ số khả dụng
          description: Bật từng chỉ số mà trình duyệt này hỗ trợ.
        start-recording: Bắt đầu ghi
        stop-recording: Dừng ghi ({seconds} giây)
        export-last-recording: Xuất bản ghi gần nhất
      metrics:
        frame-duration:
          label: Thời gian khung hình (ms)
          description: Thời gian giữa các khung hình hoạt ảnh trong 10 giây qua.
        long-task:
          label: Tác vụ dài
          description: Các tác vụ luồng chính (main-thread) mất ít nhất 50 ms.
          unsupported: Trình duyệt này không hiển thị thời gian tác vụ dài.
        memory:
          description: Dung lượng bộ nhớ JavaScript heap từ API performance.memory của Chromium.
          unsupported: Trình duyệt này không hiển thị dung lượng bộ nhớ JavaScript heap.
          label: Bộ nhớ heap JS (MB)
        fps:
          label: FPS
          description: Tốc độ khung hình trong 10 giây gần nhất. Mỗi mẫu bằng 1000 chia cho khoảng thời gian giữa hai khung hình tính bằng mili giây.
      recording:
        title: Bản ghi gần nhất
        duration: Thời lượng {duration} ms
        limit: Bản ghi sẽ dừng sau 60 giây.
      overlay:
        title: Hiệu năng
        move: Di chuyển lớp phủ hiệu năng
        reset-position: Đặt lại vị trí lớp phủ
        record: Ghi
        stop: Dừng
        export: Xuất bản ghi gần nhất
        average: trung bình
      resource-events:
        title: Sự kiện tài nguyên gần đây
        description: Sự kiện mới nhận được hiển thị trước. Thời gian tính bằng mili giây kể từ khi trình kết xuất nguồn khởi động.
        empty: Chưa ghi nhận sự kiện tài nguyên nào. Hãy tải hoặc chuyển mô hình VRM khi tính năng theo dõi đang bật.
        columns:
          time: Thời gian (ms)
          phase: Giai đoạn
          reason: Lý do
          textures: Kết cấu
          geometries: Hình học
          meshes: Lưới
          materials: Vật liệu
      history:
        title: Lịch sử FPS
        latest: Gần nhất
        minimum: Tối thiểu
        maximum: Tối đa
        seconds-ago: -{seconds} giây
        end: 0 giây
        empty: Chưa có mẫu FPS. Hãy bật FPS để thu thập mẫu.
    markdown-stress:
      title: Kiểm thử áp lực Markdown
      description: Kiểm tra khả năng xử lý và hiển thị Markdown với dữ liệu hội thoại lớn
    io-tracer:
      title: Trình theo dõi I/O (IO Tracer)
    widgets-calling:
      title: Gọi Widget
    presence-bubble:
      title: Bong bóng trạng thái
      description: Điều khiển bong bóng phía trên nhân vật và xem kết quả trong cửa sổ chính
      override:
        title: Điều khiển bong bóng từ đây
        description: Khi tùy chọn này tắt, sân khấu sẽ không hiện bong bóng trừ khi đang có một lượt trò chuyện chạy.
      thinking:
        title: Đang suy nghĩ
        description: Hiển thị các dấu chấm. Trạng thái này được ưu tiên hơn số tin nhắn chưa đọc.
      unread:
        title: Tin nhắn chưa đọc
        description: Hiển thị thành một bảng trên đầu nhân vật, kèm dấu hiệu và số lượng.
      main-window-note: Các thay đổi sẽ xuất hiện trong cửa sổ AIRI chính.
    live2d-ambient-light:
      title: Ánh sáng môi trường Live2D
      description: Điều chỉnh việc lấy mẫu màn hình và shader ánh sáng màu của Live2D
      controls:
        title: Nguồn sáng và đầu ra
      enabled:
        title: Ánh sáng môi trường
        description: Áp dụng bộ lọc ánh sáng môi trường cho mô hình Live2D đang hoạt động.
      source:
        title: Nguồn sáng
        options:
          screen-capture: Chụp màn hình
          forced-color: Màu cố định
      mode:
        title: Chế độ chiếu sáng
        options:
          window-gradient: Chuyển sắc theo cửa sổ
          global: Ánh sáng môi trường toàn cục
      forced-color:
        title: Màu thử nghiệm
        description: Áp dụng màu này mà không cần chụp màn hình.
      strength:
        title: Cường độ ánh sáng
        description: Đặt mức độ hiệu ứng tổng thể. Giá trị 1 là giao diện thiết kế mặc định; tăng đến 3 sẽ làm ánh sáng bao quanh và đèn viền phía sau mạnh hơn.
      squint:
        title: Nheo mắt khi độ sáng thay đổi mạnh
        description: Làm mắt hẹp lại khi màn hình sáng lên nhanh hơn mức nhân vật kịp thích nghi. Nếu màn hình duy trì sáng, mắt sẽ mở lại. Giá trị 0 sẽ tắt tính năng này.
      main-window-note: Các thay đổi sẽ xuất hiện trong cửa sổ AIRI chính.
      diagnostics:
        title: Chẩn đoán việc chụp
        waiting: Đang chờ dữ liệu chẩn đoán từ cửa sổ AIRI chính.
        status:
          disabled: Đã tắt
          starting: Đang khởi động
          capturing: Đang chụp
          forced-color: Màu cố định
          error: Lỗi
        capture:
          title: Trạng thái chụp
          description: Kiểm tra màn hình đã chọn, kích thước khung chụp và tọa độ vùng loại trừ.
          display: Màn hình và giới hạn
          video-size: Video nguồn
          sample-size: Khung hình mẫu
          window-bounds: Giới hạn cửa sổ AIRI
          excluded-region: Vùng bị loại trừ
          exposure: Mức phơi sáng màn hình
          behind-luminance: Ánh sáng phía sau nhân vật
          updated: Cập nhật gần nhất
        preview:
          title: Khung chụp đã thu nhỏ
          description: Khung chữ nhật đỏ đánh dấu cửa sổ AIRI. Khung nét đứt đánh dấu vùng mà các bản đồ ánh sáng bao phủ.
          unavailable: Chưa có khung hình nào được chụp.
        pixels:
          title: Phân loại điểm ảnh
          total: Tổng số
          accepted: Được chấp nhận
          excluded: Đã tô
          transparent: Trong suốt
          see-through: Nhìn xuyên qua
        maps:
          title: Bản đồ ánh sáng
          window: Mỗi bản đồ bao phủ cửa sổ AIRI và thêm nửa chiều rộng cửa sổ ở mỗi phía. Đường viền đánh dấu cửa sổ.
          unavailable: Chưa có dữ liệu môi trường.
          target: Giá trị đo được
          applied: Đã áp dụng sau khi làm mượt
          surround:
            title: Bản đồ ánh sáng bao quanh
            description: Làm mờ rộng phần màn hình xung quanh và phía sau cửa sổ. Bản đồ này mang màu của nguồn sáng và hướng ánh sáng chiếu tới.
          contact:
            title: Bản đồ ánh sáng tiếp xúc
            description: Làm mờ hẹp cùng vùng nội dung. Bản đồ này điều khiển hiệu ứng ánh sáng ôm viền và viền sáng phía sau.
      sampling:
        title: Lấy mẫu màn hình
        capture-interval:
          title: Khoảng thời gian chụp
          description: Đặt thời gian giữa các lần lấy mẫu màn hình. Luồng chụp sẽ chạy theo tần suất này.
        response-time:
          title: Thời gian phản hồi
          description: Đặt tốc độ màu đã lấy mẫu thích nghi với thay đổi trên màn hình.
        sample-width:
          title: Kích thước mẫu
          description: Đặt chiều rộng của khung chụp đã thu nhỏ. Khung rộng hơn sẽ đưa nhiều chi tiết hơn vào bản đồ ánh sáng. Chiều cao tự điều chỉnh theo màn hình.
        neutral-color-weight:
          title: Trọng số màu trung tính
          description: Đặt trọng số tối thiểu cho các màu có độ bão hòa thấp. Nội dung có màu sẽ được tính trọng số cao hơn màu xám.
      shader:
        title: Phản hồi của shader
        dark-base:
          title: Mức sáng tối thiểu
          description: Đặt độ sáng của mô hình khi nền màn hình đen. Với màn hình trắng, mô hình hiển thị đúng như bản vẽ; khi màn hình tối hơn, mô hình sẽ giảm sáng dần về mức tối thiểu này.
        base-curve:
          title: Đường cong độ sáng
          description: Đặt cách độ sáng của mô hình tăng từ mức tối thiểu đến độ sáng gốc của hình vẽ. Khi giá trị lớn hơn 1, màn hình sáng một nửa sẽ giữ mô hình gần mức tối thiểu hơn.
        local-share:
          title: Tỷ lệ ánh sáng cục bộ
          description: Đặt mức độ độ sáng của mô hình phụ thuộc vào ánh sáng ngay bên cạnh thay vì toàn bộ màn hình. Ở mức 0, mô hình giữ cùng một độ sáng dù cửa sổ nằm ở đâu.
        tint:
          title: Ám màu
          description: Đặt mức độ mô hình nhận sắc màu từ màn hình. Ở mức 0, chỉ độ sáng của màn hình ảnh hưởng đến mô hình.
        color-boost:
          title: Tăng màu trong ánh sáng yếu
          description: Đặt lượng màu bổ sung mà mô hình nhận từ nguồn sáng yếu nhưng bão hòa cao. Độ sáng vẫn theo nguồn sáng và không kênh màu nào thấp hơn mô hình khi chưa được chiếu sáng.
        wrap-intensity:
          title: Cường độ ánh sáng ôm viền
          description: Đặt mức độ màu nền lan vào rìa của mô hình.
        wrap-saturation:
          title: Độ bão hòa ánh sáng ôm viền
          description: Đặt mức độ sắc màu của màn hình được giữ lại trong ánh sáng ôm viền. Giá trị 0 thêm ánh sáng trắng có cùng độ sáng. Giá trị 1 thêm đầy đủ màu của màn hình.
        backlight:
          title: Đèn viền phía sau
          description: Đặt cường độ ánh sáng từ phía sau nhân vật chiếu lên đường viền mỏng quanh toàn bộ cạnh của mô hình.
        wrap-diffuse:
          title: Độ rộng ánh sáng ôm viền
          description: Đặt khoảng cách màu nền được ôm vào phía trong cạnh của mô hình.
        translucent-wrap:
          title: Giảm ánh sáng ôm viền trên phần bán trong suốt
          description: Điều chỉnh ánh sáng ôm viền và viền sáng theo bình phương độ alpha của mô hình. Các phần được vẽ với alpha một phần vốn đã cho thấy màn hình nền phía sau xuyên qua.
      preview-shader:
        title: Xem trước shader
        description: Chạy shader thật trên một thẻ thử nghiệm bằng môi trường trực tiếp và các cài đặt ở trên.
        window-mapping: Bộ lọc coi toàn bộ canvas này là cửa sổ sân khấu, vì vậy bản xem trước không phải bản sao chính xác từng điểm ảnh của sân khấu.
        filtered: Đầu ra shader
        unavailable: Bản xem trước cần WebGL nhưng cửa sổ này không thể tạo ngữ cảnh WebGL.
        environment:
          live: Ánh sáng lấy từ ảnh chụp gần nhất do cửa sổ AIRI chính cung cấp.
          neutral: Chưa nhận được ảnh chụp nào nên bản xem trước đang dùng môi trường trung tính.
        regions:
          title: Các vùng của thẻ thử nghiệm
          body: Phần thân rộng có dải tông màu từ sRGB {low} đến {high}. Có thể quan sát độ sáng, độ tương phản, sắc độ và khoảng dư sáng dọc theo vùng này.
          bars: Các thanh có độ rộng lần lượt là {first}, {second}, {third}, {fourth} và {fifth} điểm ảnh. Chúng cho thấy ánh sáng ôm viền đi sâu vào một hình mỏng đến đâu.
          patches: Hai mảng được vẽ với alpha {strong} và {weak}; tùy chọn giảm ánh sáng trên phần bán trong suốt sẽ tác động lên chúng.
    live2d-motion:
      title: Điều khiển chuyển động Live2D
      description: Điều khiển chuyển động mắt, đầu và cơ thể của Live2D.
      actions:
        back: Quay lại
      system-audio:
        title: Đồng bộ môi theo âm thanh hệ thống
        description: Thu âm thanh từ các trình phát khác. Cùng nguồn đầu vào này sẽ điều khiển cả đồng bộ theo nhịp và chuyển động miệng Live2D.
        signal: Tín hiệu đầu vào
        mouth-open: Độ mở miệng
        input-volume-threshold: Ngưỡng âm lượng đầu vào
        random-close-delay: Độ trễ đóng miệng ngẫu nhiên
        random-close-probability: Xác suất đóng miệng ngẫu nhiên
        actions:
          start: Bắt đầu nhận đầu vào
          stop: Dừng nhận đầu vào
      panels:
        direct-control: Điều khiển trực tiếp
        preview: Xem trước mô hình
        timeline: Dòng thời gian
        inference: Suy luận mô hình
      preview:
        groups:
          expression: Biểu cảm
          offset: Độ lệch vị trí
        values:
          squint: Nheo mắt
          mouth-form: Hình miệng
          mouth-open: Độ mở
      joystick-label: Cần điều khiển chuyển động Live2D
      wave:
        toggle: Chế độ thuyền
      instructions: Kéo cần điều khiển hoặc dùng các phím mũi tên để điều khiển X/Y. Phím R làm mắt nheo nhẹ. Phím F làm mắt nheo mạnh hơn. Phím C nhắm mắt. W/S thay đổi hình miệng. Phím Space mở miệng. A/D di chuyển cơ thể theo trục X. Q/E nghiêng đầu. Khi thả phím, giá trị sẽ trở về giữa một cách mượt mà.
      parameter-note: Cần điều khiển thay đổi X/Y. R tương ứng nheo mắt 1/3. F tương ứng nheo mắt 2/3. C tương ứng nhắm mắt hoàn toàn. W/S tương ứng hình miệng ±1. Space tương ứng độ mở miệng 1. A/D tương ứng cơ thể X ±10°. Q/E tương ứng đầu Z ±30°.
      input:
        keyboard: Bàn phím
        controller: Tay cầm
      input-actions:
        move-body-head: Di chuyển cơ thể và đầu
        tilt-head: Nghiêng đầu
        blink: Chớp mắt
        open-mouth: Mở miệng
        mouth-shape: Thay đổi hình miệng
      eye-view:
        title: Khóa hướng nhìn của mắt
        description: Chọn một mục tiêu. Mắt sẽ bù lại chuyển động của đầu để tiếp tục nhìn vào mục tiêu đó.
        pad-label: Mục tiêu hướng nhìn đã khóa
        actions:
          enable: Bật khóa nhìn
          disable: Tắt khóa nhìn
          center: Đưa mục tiêu về giữa
        counter:
          label: Cường độ bù chuyển động đầu
          description: Mức độ mắt bù lại chuyển động đầu theo trục X/Y.
        values:
          target: Mục tiêu
          output: Đầu ra của mắt
      editor:
        title: Trình chỉnh sửa chuyển động
        instructions: Đường cong màu xám là dữ liệu nguồn. Thêm các lớp phủ chuyển động hoặc khung khóa mục tiêu nhìn. Chọn một track rồi kéo các điểm của nó.
        play: Phát dòng thời gian
        pause: Tạm dừng dòng thời gian
        undo: Hoàn tác
        redo: Làm lại
        crop-to-view: Cắt theo vùng đang xem
        reset-view: Đặt lại khung xem
